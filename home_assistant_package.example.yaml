# Adapt node and entity names after adding the ESPHome integration.
# last_seen must timestamp the physical measurement matching the temperature.
# Do not replace it with now(), last_changed or a cached-state report.
# Rename the "Durée maximale de la mesure" entity to the ID used below,
# or update its references; its value in seconds comes from the firmware.
script:
  cnrf_proxy_temperature_chambre:
    alias: PAC - Envoyer la mesure datée de la chambre
    mode: restart
    fields:
      temperature:
        required: true
      sample_timestamp:
        required: true
    sequence:
      - action: esphome.ecodan_cnrf_proxy_cnrf_override
        data:
          temperature: "{{ temperature | float }}"
          sample_age_ms: >-
            {{ ((as_timestamp(now()) - as_timestamp(sample_timestamp, 0)) * 1000)
               | round(0, 'ceil') | int }}

  cnrf_proxy_retour_salon:
    alias: PAC - Revenir au thermostat du salon
    mode: restart
    sequence:
      - action: esphome.ecodan_cnrf_proxy_cnrf_disable

automation:
  - id: cnrf_proxy_temperature_nuit
    alias: PAC - Sonde chambre via proxy CNRF
    mode: restart
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: time
        at: "22:30:00"
      - trigger: time
        at: "07:00:00"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - sensor.temperature_chambre
          - sensor.temperature_chambre_last_seen
          - sensor.ecodan_cnrf_proxy_override_timeout
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set minute = now().hour * 60 + now().minute %}
                  {% set temp = states('sensor.temperature_chambre') %}
                  {% set stamp = as_timestamp(states('sensor.temperature_chambre_last_seen'), none) %}
                  {% set timeout = states('sensor.ecodan_cnrf_proxy_override_timeout') %}
                  {{ (minute >= 22 * 60 + 30 or minute < 7 * 60)
                     and temp | is_number and 10 <= temp | float <= 30
                     and timeout | is_number and timeout | float > 0
                     and stamp is not none and 0 <= as_timestamp(now()) - stamp < timeout | float
                     and not state_attr('sensor.temperature_chambre', 'restored')
                     and not state_attr('sensor.temperature_chambre_last_seen', 'restored')
                     and not state_attr('sensor.ecodan_cnrf_proxy_override_timeout', 'restored') }}
            sequence:
              - action: script.cnrf_proxy_temperature_chambre
                data:
                  temperature: "{{ states('sensor.temperature_chambre') }}"
                  sample_timestamp: "{{ states('sensor.temperature_chambre_last_seen') }}"
        default:
          - action: script.cnrf_proxy_retour_salon
